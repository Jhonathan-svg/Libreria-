<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b2c;--deep:#14263d;--line:#243a57;--ink:#f1ece2;--mut:#9fb0c3;--lamp:#f2b84b;--paper:#efe6d2;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);min-height:100vh}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:700;margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 5vw}
.logo{font-size:1.5rem;text-decoration:none}
.search{flex:1 1 220px;max-width:420px;background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--ink);font:inherit}
.search::placeholder{color:var(--mut)}
main{padding:0 5vw 60px}
.sec{margin:28px 0 40px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-h h2{font-size:1.4rem}
.arrows{display:flex;gap:8px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--deep)}
.arrows button:hover{border-color:var(--lamp);color:var(--lamp)}
.row{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;scrollbar-width:thin}
.card{flex:none;width:168px;scroll-snap-align:start;text-decoration:none;display:block}
.cv{aspect-ratio:3/4;border-radius:6px 12px 12px 6px;overflow:hidden;background:var(--deep);box-shadow:-3px 0 0 rgba(0,0,0,.35) inset,0 10px 24px rgba(0,0,0,.45);transition:transform .2s}
.card:hover .cv{transform:translateY(-6px)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.05rem;line-height:1.2;background:linear-gradient(160deg,#27456b,#0e1b2c);color:var(--paper)}
.card b{display:block;margin-top:12px;font-weight:600;line-height:1.3}
.card small{color:var(--mut)}
.empty{color:var(--mut);padding:40px 0}
/* página del libro */
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;margin:6px 0 24px}
.back:hover{border-color:var(--lamp)}
.detail{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:48px;align-items:start}
.detail .cv{max-width:340px}
.info h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1}
.meta{color:var(--mut);margin:10px 0 18px}
.syn{max-width:62ch;font-family:Fraunces,Georgia,serif;font-weight:500;line-height:1.7;color:#e6dfd0}
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 18px}
.tabs button{padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:var(--deep)}
.tabs button[aria-selected=true]{background:var(--lamp);border-color:var(--lamp);color:#241a05;font-weight:600}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--deep);overflow:hidden}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 12px 24px;background:radial-gradient(ellipse at 50% 30%,#1d3555,#10203a 70%)}
.scene{perspective:1100px;width:220px;height:340px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.scene:active{cursor:grabbing}
.book{width:220px;height:320px;position:relative;transform-style:preserve-3d;margin-top:10px}
.f{position:absolute;backface-visibility:hidden;overflow:hidden}
.f.front{width:220px;height:320px;transform:translateZ(22px);border-radius:3px 8px 8px 3px}
.f.front img{width:100%;height:100%;object-fit:cover;display:block}
.f.back{width:220px;height:320px;transform:rotateY(180deg) translateZ(22px);background:#1a2f4d;color:var(--paper);padding:20px;font:500 .78rem/1.5 Fraunces,Georgia,serif;display:flex;align-items:center}
.f.spine{width:44px;height:320px;left:88px;transform:rotateY(-90deg) translateZ(110px);background:#17304f;display:flex;align-items:center;justify-content:center}
.f.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 .85rem Fraunces,Georgia,serif;color:var(--paper);white-space:nowrap;overflow:hidden;max-height:290px}
.f.pages{width:44px;height:314px;left:88px;top:3px;transform:rotateY(90deg) translateZ(110px);background:repeating-linear-gradient(90deg,var(--paper) 0 2px,#d9cdb2 2px 3px)}
.hint{color:var(--mut);font-size:.9rem;margin:0}
.pdfbar{display:flex;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.btn{display:inline-block;padding:9px 18px;border-radius:999px;border:1px solid var(--lamp);text-decoration:none;color:var(--lamp)}
.btn.go{background:var(--lamp);color:#241a05;font-weight:600}
.btn:hover{background:var(--lamp);color:#241a05}
iframe{display:block;width:100%;height:78vh;border:0;background:#fff}
@media(max-width:760px){.detail{grid-template-columns:1fr;gap:28px}.detail .cv{max-width:220px;margin:0 auto}.card{width:140px}}

/* noche lluviosa con luna llena */
.sky{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(180deg,#040a15 0%,#0a1829 55%,#13294a 100%)}
.moon{position:absolute;top:7vh;right:9vw;width:clamp(90px,14vw,160px);aspect-ratio:1;border-radius:50%;
background:radial-gradient(circle at 35% 32%,#fffef5 0%,#f6f1dc 50%,#d8d0b3 100%);
box-shadow:0 0 30px 6px rgba(255,248,222,.4),0 0 120px 40px rgba(190,210,255,.2);animation:glow 8s ease-in-out infinite alternate}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:.55;
background:radial-gradient(circle at 30% 40%,#bdb597 0 9%,transparent 10%),radial-gradient(circle at 62% 28%,#c7bfa2 0 6%,transparent 7%),radial-gradient(circle at 58% 66%,#bcb394 0 12%,transparent 13%),radial-gradient(circle at 22% 70%,#c9c1a4 0 5%,transparent 6%),radial-gradient(circle at 78% 55%,#c4bc9d 0 4%,transparent 5%)}
@keyframes glow{from{box-shadow:0 0 26px 5px rgba(255,248,222,.34),0 0 100px 34px rgba(190,210,255,.16)}to{box-shadow:0 0 36px 8px rgba(255,248,222,.46),0 0 140px 50px rgba(190,210,255,.24)}}
.cloud{position:absolute;width:55vw;height:110px;border-radius:50%;background:rgba(18,32,54,.75);filter:blur(34px);animation:drift linear infinite}
.c1{top:2vh;left:-60vw;animation-duration:95s}
.c2{top:14vh;left:-60vw;animation-duration:140s;animation-delay:-60s;height:90px;opacity:.8}
.c3{top:-2vh;left:-60vw;animation-duration:115s;animation-delay:-30s}
@keyframes drift{to{transform:translateX(170vw)}}
.flash{position:absolute;inset:0;background:#cfe0ff;opacity:0;animation:flash 17s infinite}
@keyframes flash{0%,90%,100%{opacity:0}91%{opacity:.10}92%{opacity:0}93.5%{opacity:.18}95%{opacity:0}}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
@media(prefers-reduced-motion:reduce){.cloud,.flash,.moon{animation:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="flash"></div></div>
<canvas id="rain" aria-hidden="true"></canvas>
<header class="top">
  <a class="logo serif" href="#" id="home-link">Mi biblioteca</a>
  <input class="search" id="q" type="search" placeholder="Buscar por título o autor" aria-label="Buscar por título o autor">
</header>
<main id="app"></main>

<script>
/* estrellas y lluvia */
(() => {
  const cv = document.getElementById("rain"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, drops, stars, splashes = [];
  const mk = (anywhere) => ({ x: Math.random() * (w + 80), y: anywhere ? Math.random() * h : -30,
    len: 12 + Math.random() * 22, v: 9 + Math.random() * 9, a: .12 + Math.random() * .3 });
  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drops = Array.from({ length: Math.min(260, Math.floor(w / 5)) }, () => mk(true));
    stars = Array.from({ length: 70 }, () => ({ x: Math.random() * w, y: Math.random() * h * .55,
      r: Math.random() * 1.2 + .3, p: Math.random() * 6.28, s: .01 + Math.random() * .02 }));
  }
  function frame(){
    ctx.clearRect(0, 0, w, h);
    for (const t of stars){
      t.p += t.s;
      ctx.fillStyle = `rgba(255,250,235,${.25 + .35 * Math.abs(Math.sin(t.p))})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.28); ctx.fill();
    }
    ctx.lineWidth = 1.1; ctx.lineCap = "round";
    for (const d of drops){
      ctx.strokeStyle = `rgba(185,205,235,${d.a})`;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.len * .18, d.y + d.len); ctx.stroke();
      d.y += d.v; d.x -= d.v * .18;
      if (d.y > h){
        if (Math.random() < .35) splashes.push({ x: d.x, y: h - 2, r: 1, a: .35 });
        Object.assign(d, mk(false));
      }
      if (d.x < -20) d.x = w + 20;
    }
    splashes = splashes.filter(s => (s.r += .5) < 9);
    for (const s of splashes){
      ctx.strokeStyle = `rgba(185,205,235,${.3 * (1 - s.r / 9)})`;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * .35, 0, 0, 6.28); ctx.stroke();
    }
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener("resize", () => { resize(); if (still) frame(); });
  resize(); frame();
})();
</script>
<script src="libros.js"></script>
<script>
const app = document.getElementById("app");
const q = document.getElementById("q");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let raf = 0;

function cover(l){
  const fb = `<div class="fb">${esc(l.titulo)}</div>`;
  return `<div class="cv"><img src="${esc(l.portada)}" alt="Portada de ${esc(l.titulo)}" loading="lazy" onerror="this.outerHTML=this.parentNode.dataset.fb" ></div>`.replace('<div class="cv">', `<div class="cv" data-fb="${esc(fb)}">`);
}

function home(){
  cancelAnimationFrame(raf);
  const t = q.value.trim().toLowerCase();
  const lista = LIBROS.filter(l => (l.titulo + " " + l.autor).toLowerCase().includes(t));
  if(!lista.length){ app.innerHTML = '<p class="empty">No encontramos libros con esa búsqueda.</p>'; return; }
  const grupos = {};
  lista.forEach(l => (grupos[l.genero] ||= []).push(l));
  const reciente = [...lista].sort((a,b) => b.anio - a.anio).slice(0,12);
  const secciones = [["Agregados recientemente", reciente], ...Object.entries(grupos)];
  app.innerHTML = secciones.map(([nombre, libros], i) => `
    <section class="sec">
      <div class="sec-h"><h2>${esc(nombre)}</h2>
        <div class="arrows"><button data-s="${i}" data-d="-1" aria-label="Anterior">‹</button><button data-s="${i}" data-d="1" aria-label="Siguiente">›</button></div></div>
      <div class="row" id="row${i}">${libros.map(l => `
        <a class="card" href="#${esc(l.id)}">${cover(l)}<b>${esc(l.titulo)}</b><small>${esc(l.autor)}, ${l.anio}</small></a>`).join("")}</div>
    </section>`).join("");
}

function detalle(l){
  cancelAnimationFrame(raf);
  const u = "lector.html?libro=" + encodeURIComponent(l.id);
  app.innerHTML = `
    <button class="back" id="back">Volver a la biblioteca</button>
    <div class="detail">
      ${cover(l)}
      <div class="info">
        <h1>${esc(l.titulo)}</h1>
        <p class="meta">${esc(l.autor)}, ${esc(l.genero)}, ${l.anio}</p>
        <p class="syn">${esc(l.sinopsis)}</p>
        <div class="tabs">
          <a class="btn go" href="${u}#3d">Ver en 3D</a>
          <a class="btn" href="${u}#pdf">Leer como PDF</a>
        </div>
      </div>
    </div>`;
  document.getElementById("back").onclick = () => { location.hash = ""; };
}

function ruta(){
  const l = LIBROS.find(x => x.id === location.hash.slice(1));
  window.scrollTo(0, 0);
  l ? detalle(l) : home();
}

app.addEventListener("click", e => {
  const b = e.target.closest(".arrows button");
  if(!b) return;
  const r = document.getElementById("row" + b.dataset.s);
  r.scrollBy({ left: b.dataset.d * r.clientWidth * 0.85, behavior: "smooth" });
});
q.addEventListener("input", () => { if(location.hash) location.hash = ""; else home(); });
window.addEventListener("hashchange", ruta);
ruta();
</script>
</body>
</html>
