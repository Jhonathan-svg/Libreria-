<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b2c;--deep:#14263d;--line:#243a57;--ink:#f1ece2;--mut:#9fb0c3;--lamp:#f2b84b;--paper:#efe6d2;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);min-height:100vh}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:700;margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 5vw}
.logo{font-size:1.5rem;text-decoration:none}
.search{flex:1 1 220px;max-width:420px;background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--ink);font:inherit}
.search::placeholder{color:var(--mut)}
main{padding:0 5vw 60px}
.sec{margin:28px 0 40px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-h h2{font-size:1.4rem}
.arrows{display:flex;gap:8px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--deep)}
.arrows button:hover{border-color:var(--lamp);color:var(--lamp)}
.row{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;scrollbar-width:thin}
.card{flex:none;width:168px;scroll-snap-align:start;text-decoration:none;display:block}
.cv{aspect-ratio:3/4;border-radius:6px 12px 12px 6px;overflow:hidden;background:var(--deep);box-shadow:-3px 0 0 rgba(0,0,0,.35) inset,0 10px 24px rgba(0,0,0,.45);transition:transform .2s}
.card:hover .cv{transform:translateY(-6px)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.05rem;line-height:1.2;background:linear-gradient(160deg,#27456b,#0e1b2c);color:var(--paper)}
.card b{display:block;margin-top:12px;font-weight:600;line-height:1.3}
.card small{color:var(--mut)}
.empty{color:var(--mut);padding:40px 0}
.st{display:inline-block;letter-spacing:2px;background:linear-gradient(90deg,var(--lamp) var(--p,0%),#3a4f6b var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.rt{display:block;font-size:.85rem;color:var(--mut);margin-top:3px}
.rate{margin:0 0 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.rate .big{font-size:1.1rem}
.rate .big .st{font-size:1.5rem;vertical-align:middle}
.pick{display:flex;gap:2px;margin-left:-4px}
.pick button{background:none;border:0;padding:2px 3px;font-size:2rem;line-height:1;color:#3a4f6b;transition:transform .12s,color .12s}
.pick button.on{color:var(--lamp)}
.pick button:hover{transform:scale(1.18)}
.rate .hint{margin:2px 0 0}
.top .btn{white-space:nowrap}
.sala-t{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:40px 28px;padding:18px 0 40px}
.frame{background:none;border:0;padding:0;text-align:center;display:block}
.frame .mk{display:block;padding:12px;background:linear-gradient(135deg,#7a4e28,#3d2412);border-radius:3px;box-shadow:0 14px 28px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,214,150,.2);transition:transform .25s}
.frame .lienzo{display:block;aspect-ratio:1;padding:10px;background:var(--paper);box-shadow:inset 0 0 14px rgba(0,0,0,.35)}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.frame:hover .mk,.frame:focus-visible .mk{transform:translateY(-5px) rotate(-.8deg)}
.frame b{display:block;margin-top:14px;font-family:Fraunces,Georgia,serif}
.frame small{color:var(--mut)}
.lb{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:5vw;background:rgba(6,4,3,.9);cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:76vh;background:var(--paper);padding:12px;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb p{margin:0;font-family:Fraunces,Georgia,serif;font-size:1.2rem}
/* página del libro */
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;margin:6px 0 24px}
.back:hover{border-color:var(--lamp)}
.detail{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:48px;align-items:start}
.detail .cv{max-width:340px}
.info h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1}
.meta{color:var(--mut);margin:10px 0 18px}
.syn{max-width:62ch;font-family:Fraunces,Georgia,serif;font-weight:500;line-height:1.7;color:#e6dfd0}
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 18px}
.tabs button{padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:var(--deep)}
.tabs button[aria-selected=true]{background:var(--lamp);border-color:var(--lamp);color:#241a05;font-weight:600}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--deep);overflow:hidden}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 12px 24px;background:radial-gradient(ellipse at 50% 30%,#1d3555,#10203a 70%)}
.scene{perspective:1100px;width:220px;height:340px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.scene:active{cursor:grabbing}
.book{width:220px;height:320px;position:relative;transform-style:preserve-3d;margin-top:10px}
.f{position:absolute;backface-visibility:hidden;overflow:hidden}
.f.front{width:220px;height:320px;transform:translateZ(22px);border-radius:3px 8px 8px 3px}
.f.front img{width:100%;height:100%;object-fit:cover;display:block}
.f.back{width:220px;height:320px;transform:rotateY(180deg) translateZ(22px);background:#1a2f4d;color:var(--paper);padding:20px;font:500 .78rem/1.5 Fraunces,Georgia,serif;display:flex;align-items:center}
.f.spine{width:44px;height:320px;left:88px;transform:rotateY(-90deg) translateZ(110px);background:#17304f;display:flex;align-items:center;justify-content:center}
.f.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 .85rem Fraunces,Georgia,serif;color:var(--paper);white-space:nowrap;overflow:hidden;max-height:290px}
.f.pages{width:44px;height:314px;left:88px;top:3px;transform:rotateY(90deg) translateZ(110px);background:repeating-linear-gradient(90deg,var(--paper) 0 2px,#d9cdb2 2px 3px)}
.hint{color:var(--mut);font-size:.9rem;margin:0}
.pdfbar{display:flex;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.btn{display:inline-block;padding:9px 18px;border-radius:999px;border:1px solid var(--lamp);text-decoration:none;color:var(--lamp)}
.btn.go{background:var(--lamp);color:#241a05;font-weight:600}
.btn:hover{background:var(--lamp);color:#241a05}
iframe{display:block;width:100%;height:78vh;border:0;background:#fff}
@media(max-width:760px){.detail{grid-template-columns:1fr;gap:28px}.detail .cv{max-width:220px;margin:0 auto}.card{width:140px}}

/* noche lluviosa con luna llena */
.sky{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(180deg,#040a15 0%,#0a1829 55%,#13294a 100%)}
.moon{position:absolute;top:7vh;right:9vw;width:clamp(90px,14vw,160px);aspect-ratio:1;border-radius:50%;
background:radial-gradient(circle at 35% 32%,#fffef5 0%,#f6f1dc 50%,#d8d0b3 100%);
box-shadow:0 0 30px 6px rgba(255,248,222,.4),0 0 120px 40px rgba(190,210,255,.2);animation:glow 8s ease-in-out infinite alternate}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:.55;
background:radial-gradient(circle at 30% 40%,#bdb597 0 9%,transparent 10%),radial-gradient(circle at 62% 28%,#c7bfa2 0 6%,transparent 7%),radial-gradient(circle at 58% 66%,#bcb394 0 12%,transparent 13%),radial-gradient(circle at 22% 70%,#c9c1a4 0 5%,transparent 6%),radial-gradient(circle at 78% 55%,#c4bc9d 0 4%,transparent 5%)}
@keyframes glow{from{box-shadow:0 0 26px 5px rgba(255,248,222,.34),0 0 100px 34px rgba(190,210,255,.16)}to{box-shadow:0 0 36px 8px rgba(255,248,222,.46),0 0 140px 50px rgba(190,210,255,.24)}}
.cloud{position:absolute;width:55vw;height:110px;border-radius:50%;background:rgba(18,32,54,.75);filter:blur(34px);animation:drift linear infinite}
.c1{top:2vh;left:-60vw;animation-duration:95s}
.c2{top:14vh;left:-60vw;animation-duration:140s;animation-delay:-60s;height:90px;opacity:.8}
.c3{top:-2vh;left:-60vw;animation-duration:115s;animation-delay:-30s}
@keyframes drift{to{transform:translateX(170vw)}}
.flash{position:absolute;inset:0;background:#cfe0ff;opacity:0;animation:flash 17s infinite}
@keyframes flash{0%,90%,100%{opacity:0}91%{opacity:.10}92%{opacity:0}93.5%{opacity:.18}95%{opacity:0}}
.sky{transition:opacity 1.4s ease}
.sky2{position:fixed;inset:0;z-index:-2;opacity:0;pointer-events:none;overflow:hidden;transition:opacity 1.4s ease;
background:radial-gradient(ellipse at 15% 5%,rgba(242,184,75,.30),transparent 45%),radial-gradient(ellipse at 90% 100%,rgba(130,65,20,.35),transparent 55%),linear-gradient(180deg,#120b07,#21140b 60%,#2e1c0f)}
.sky2::before{content:"";position:absolute;top:-25%;left:-10%;width:65%;height:150%;background:linear-gradient(100deg,transparent 30%,rgba(242,184,75,.08) 46%,transparent 62%);transform-origin:top left;animation:sway 12s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
body.leyendo .sky{opacity:0}
body.leyendo .sky2{opacity:1}
.vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:0;pointer-events:none;transition:opacity 1.4s ease}
body:not(.leyendo):not(.sala) #vcafe{opacity:1}
body.sala #vcastle{opacity:1}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.4s ease;background:linear-gradient(180deg,rgba(6,12,22,.50),rgba(6,12,22,.72))}
body:not(.leyendo) .veil{opacity:1}
#rain{opacity:0;transition:opacity 1.4s ease}
body.leyendo #rain{opacity:1}
body.sala .sky,body.sala .sky2{opacity:0}
body.novid .vid{opacity:0!important}
body.novid:not(.sala) #rain{opacity:1}
body.novid.sala .sky2{opacity:1}
@media(prefers-reduced-motion:reduce){.vid{display:none}}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
@media(prefers-reduced-motion:reduce){.cloud,.flash,.moon,.sky2::before{animation:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="flash"></div></div>
<div class="sky2" aria-hidden="true"></div>
<video class="vid" id="vcafe" src="fondo-biblioteca.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true" onerror="document.body.classList.add('novid')"></video>
<video class="vid" id="vcastle" src="fondo-galeria.mp4" muted loop playsinline preload="none" aria-hidden="true" onerror="document.body.classList.add('novid')"></video>
<div class="veil" aria-hidden="true"></div>
<canvas id="rain" aria-hidden="true"></canvas>
<header class="top">
  <a class="logo serif" href="#" id="home-link">Mi biblioteca</a>
  <a class="btn" href="#sala" id="sala-link">Sala de dibujos</a>
  <input class="search" id="q" type="search" placeholder="Buscar por título o autor" aria-label="Buscar por título o autor">
</header>
<main id="app"></main>

<script>
/* estrellas y lluvia */
(() => {
  const cv = document.getElementById("rain"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, drops, stars, splashes = [];
  const mk = (anywhere) => ({ x: Math.random() * (w + 80), y: anywhere ? Math.random() * h : -30,
    len: 12 + Math.random() * 22, v: 9 + Math.random() * 9, a: .12 + Math.random() * .3 });
  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drops = Array.from({ length: Math.min(260, Math.floor(w / 5)) }, () => mk(true));
    stars = Array.from({ length: 70 }, () => ({ x: Math.random() * w, y: Math.random() * h * .55,
      r: Math.random() * 1.2 + .3, p: Math.random() * 6.28, s: .01 + Math.random() * .02 }));
  }
  let mix = 0, fly = [], dust = [];
  function resizeExtra(){
    fly = Array.from({ length: Math.min(45, Math.floor(w / 28)) }, () => ({ x: Math.random() * w, y: Math.random() * h,
      r: 1.3 + Math.random() * 1.8, p: Math.random() * 6.28, s: .02 + Math.random() * .03, vx: (Math.random() - .5) * .3 }));
    dust = Array.from({ length: 60 }, () => ({ x: Math.random() * w, y: Math.random() * h,
      r: .5 + Math.random() * 1.2, v: .1 + Math.random() * .25, p: Math.random() * 6.28, a: .12 + Math.random() * .25 }));
  }
  function frame(){
    const target = document.body.classList.contains("leyendo") ? 1 : 0;
    mix = still ? target : mix + (target - mix) * .05;
    if (Math.abs(target - mix) < .003) mix = target;
    if (!still && target === 0 && mix === 0 && !document.body.classList.contains("novid")){ ctx.clearRect(0, 0, w, h); requestAnimationFrame(frame); return; }
    ctx.clearRect(0, 0, w, h);
    const night = 1 - mix;
    if (night > 0){
      ctx.globalAlpha = night;
      for (const t of stars){
        t.p += t.s;
        ctx.fillStyle = `rgba(255,250,235,${.25 + .35 * Math.abs(Math.sin(t.p))})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.28); ctx.fill();
      }
      ctx.lineWidth = 1.1; ctx.lineCap = "round";
      for (const d of drops){
        ctx.strokeStyle = `rgba(185,205,235,${d.a})`;
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.len * .18, d.y + d.len); ctx.stroke();
        d.y += d.v; d.x -= d.v * .18;
        if (d.y > h){
          if (Math.random() < .35) splashes.push({ x: d.x, y: h - 2, r: 1, a: .35 });
          Object.assign(d, mk(false));
        }
        if (d.x < -20) d.x = w + 20;
      }
      splashes = splashes.filter(s => (s.r += .5) < 9);
      for (const s of splashes){
        ctx.strokeStyle = `rgba(185,205,235,${.3 * (1 - s.r / 9)})`;
        ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * .35, 0, 0, 6.28); ctx.stroke();
      }
    }
    if (mix > 0){
      ctx.globalAlpha = mix;
      for (const m of dust){
        m.p += .01; m.y -= m.v; m.x += Math.sin(m.p) * .2;
        if (m.y < -5){ m.y = h + 5; m.x = Math.random() * w; }
        ctx.fillStyle = `rgba(255,226,160,${m.a})`;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.28); ctx.fill();
      }
      for (const f of fly){
        f.p += f.s;
        f.x += Math.sin(f.p * .7) * .35 + f.vx; f.y += Math.cos(f.p * .5) * .3 - .08;
        if (f.y < -10) f.y = h + 10; if (f.x < -10) f.x = w + 10; if (f.x > w + 10) f.x = -10;
        const al = .35 + .65 * Math.max(0, Math.sin(f.p));
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 7);
        g.addColorStop(0, `rgba(255,214,120,${al})`); g.addColorStop(.25, `rgba(242,184,75,${al * .45})`); g.addColorStop(1, "rgba(242,184,75,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 7, 0, 6.28); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener("resize", () => { resize(); resizeExtra(); if (still) frame(); });
  addEventListener("hashchange", () => { if (still) frame(); });
  resize(); resizeExtra(); frame();
})();
</script>

<script>
const app = document.getElementById("app");
const q = document.getElementById("q");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let raf = 0;

/* ===== Calificaciones =====
   Para que los votos se compartan entre todos los visitantes, pega aquí la URL de tu
   Firebase Realtime Database (ejemplo: "https://mi-biblioteca-default-rtdb.firebaseio.com").
   Si la dejas vacía, cada persona solo ve su propia calificación en su navegador. */
const VOTOS_URL = "https://libreria-b3975-default-rtdb.firebaseio.com";
const ls = { get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
             set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const vid = ls.get("visitante", null) || (() => { const v = Math.random().toString(36).slice(2, 12); ls.set("visitante", v); return v; })();
const mios = ls.get("misVotos", {});
let votos = {};
const kid = id => String(id).replace(/[.#$\[\]\/]/g, "_");

async function cargarVotos(){
  if(!VOTOS_URL) return;
  try{
    const r = await fetch(VOTOS_URL.replace(/\/$/, "") + "/votos.json");
    if(r.ok) votos = (await r.json()) || {};
  }catch(e){}
}
function resumen(id){
  const v = { ...(votos[kid(id)] || {}) };
  if(mios[id]) v[vid] = mios[id];
  const n = Object.values(v).filter(x => x >= 1 && x <= 5);
  return { n: n.length, avg: n.length ? n.reduce((a, b) => a + b, 0) / n.length : 0 };
}
function votar(id, n){
  mios[id] = n; ls.set("misVotos", mios);
  (votos[kid(id)] ||= {})[vid] = n;
  if(VOTOS_URL) fetch(VOTOS_URL.replace(/\/$/, "") + "/votos/" + kid(id) + "/" + vid + ".json",
    { method: "PUT", body: JSON.stringify(n) }).catch(() => {});
}
const stars = avg => `<span class="st" style="--p:${(avg / 5 * 100).toFixed(0)}%" aria-hidden="true">★★★★★</span>`;
function rt(l){
  const r = resumen(l.id);
  return `<span class="rt" aria-label="${r.n ? "Calificación " + r.avg.toFixed(1) + " de 5" : "Sin calificaciones"}">${stars(r.avg)}${r.n ? " " + r.avg.toFixed(1) + " (" + r.n + ")" : ""}</span>`;
}
function pintarRate(l){
  const el = document.getElementById("rate"); if(!el) return;
  const r = resumen(l.id), mi = mios[l.id] || 0;
  el.innerHTML = `
    <div class="big">${stars(r.avg)} <b>${r.n ? r.avg.toFixed(1) : "Sin calificaciones"}</b>${r.n ? ` <span class="meta">(${r.n} ${r.n == 1 ? "voto" : "votos"})</span>` : ""}</div>
    <div><div class="pick" role="group" aria-label="Tu calificación">${[1,2,3,4,5].map(n =>
      `<button type="button" data-n="${n}" class="${n <= mi ? "on" : ""}" aria-label="${n} ${n > 1 ? "estrellas" : "estrella"}" aria-pressed="${n == mi}">★</button>`).join("")}</div>
      <p class="hint">${mi ? "Tu calificación: " + mi + " de 5. Toca otra estrella para cambiarla." : "¿Qué te pareció? Toca las estrellas para calificar."}</p></div>`;
  const pick = el.querySelector(".pick"), bs = [...pick.children];
  const pon = n => bs.forEach(b => b.classList.toggle("on", +b.dataset.n <= n));
  pick.addEventListener("mouseover", e => { const b = e.target.closest("button"); if(b) pon(+b.dataset.n); });
  pick.addEventListener("mouseleave", () => pon(mi));
  pick.addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; votar(l.id, +b.dataset.n); pintarRate(l); });
}

function cover(l){
  const fb = `<div class="fb">${esc(l.titulo)}</div>`;
  return `<div class="cv"><img src="${esc(l.portada)}" alt="Portada de ${esc(l.titulo)}" loading="lazy" onerror="this.outerHTML=this.parentNode.dataset.fb" ></div>`.replace('<div class="cv">', `<div class="cv" data-fb="${esc(fb)}">`);
}

function home(){
  cancelAnimationFrame(raf);
  const t = q.value.trim().toLowerCase();
  const lista = LIBROS.filter(l => (l.titulo + " " + l.autor).toLowerCase().includes(t));
  if(!lista.length){ app.innerHTML = '<p class="empty">No encontramos libros con esa búsqueda.</p>'; return; }
  const grupos = {};
  lista.forEach(l => (grupos[l.genero] ||= []).push(l));
  const reciente = [...lista].sort((a,b) => b.anio - a.anio).slice(0,12);
  const secciones = [["Agregados recientemente", reciente], ...Object.entries(grupos)];
  app.innerHTML = secciones.map(([nombre, libros], i) => `
    <section class="sec">
      <div class="sec-h"><h2>${esc(nombre)}</h2>
        <div class="arrows"><button data-s="${i}" data-d="-1" aria-label="Anterior">‹</button><button data-s="${i}" data-d="1" aria-label="Siguiente">›</button></div></div>
      <div class="row" id="row${i}">${libros.map(l => `
        <a class="card" href="#${esc(l.id)}">${cover(l)}<b>${esc(l.titulo)}</b><small>${esc(l.autor)}, ${l.anio}</small>${rt(l)}</a>`).join("")}</div>
    </section>`).join("");
}

function detalle(l){
  cancelAnimationFrame(raf);
  const u = "lector.html?libro=" + encodeURIComponent(l.id);
  app.innerHTML = `
    <button class="back" id="back">Volver a la biblioteca</button>
    <div class="detail">
      ${cover(l)}
      <div class="info">
        <h1>${esc(l.titulo)}</h1>
        <p class="meta">${esc(l.autor)}, ${esc(l.genero)}, ${l.anio}</p>
        <div class="rate" id="rate"></div>
        <p class="syn">${esc(l.sinopsis)}</p>
        <div class="tabs">
          <a class="btn go" href="${u}#3d">Ver en 3D</a>
          <a class="btn" href="${u}#pdf">Leer como PDF</a>
        </div>
      </div>
    </div>`;
  pintarRate(l);
  document.getElementById("back").onclick = () => { location.hash = ""; };
}

function sala(){
  cancelAnimationFrame(raf);
  const D = typeof DIBUJOS !== "undefined" ? DIBUJOS : [];
  app.innerHTML = `
    <button class="back" id="back">Volver a la biblioteca</button>
    <h1 class="sala-t">Sala de dibujos</h1>
    <p class="meta">Toca un dibujo para verlo en grande.</p>
    ${D.length ? `<div class="galeria">${D.map((d, i) => `
      <button type="button" class="frame" data-i="${i}" aria-label="Ver ${esc(d.titulo)}">
        <span class="mk"><span class="lienzo"><img src="${esc(d.imagen)}" alt="${esc(d.titulo)}" loading="lazy"></span></span>
        <b>${esc(d.titulo)}</b>${d.autor ? `<small>${esc(d.autor)}</small>` : ""}
      </button>`).join("")}</div>` : '<p class="empty">Aún no hay dibujos en la sala.</p>'}`;
  document.getElementById("back").onclick = () => { location.hash = ""; };
}
const lb = document.createElement("div");
lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
document.body.appendChild(lb);
const cerrarLb = () => lb.classList.remove("on");
lb.addEventListener("click", cerrarLb);
addEventListener("keydown", e => { if(e.key === "Escape") cerrarLb(); });
app.addEventListener("click", e => {
  const f = e.target.closest(".frame"); if(!f) return;
  const d = DIBUJOS[+f.dataset.i];
  lb.innerHTML = `<img src="${esc(d.imagen)}" alt="${esc(d.titulo)}"><p>${esc(d.titulo)}</p>`;
  lb.classList.add("on");
});

let vActivo = "";
function ruta(){
  const enSala = location.hash === "#sala";
  const l = enSala ? null : LIBROS.find(x => x.id === location.hash.slice(1));
  window.scrollTo(0, 0);
  const cl = document.body.classList;
  cl.toggle("leyendo", !!l); cl.toggle("sala", enSala);
  enSala ? sala() : l ? detalle(l) : home();
  vActivo = enSala ? "vcastle" : l ? "" : "vcafe";
  ["vcafe", "vcastle"].forEach(id => {
    const v = document.getElementById(id);
    if(id === vActivo) v.play().catch(() => {});
    else setTimeout(() => { if(vActivo !== id) v.pause(); }, 1500);
  });
}

app.addEventListener("click", e => {
  const b = e.target.closest(".arrows button");
  if(!b) return;
  const r = document.getElementById("row" + b.dataset.s);
  r.scrollBy({ left: b.dataset.d * r.clientWidth * 0.85, behavior: "smooth" });
});
q.addEventListener("input", () => { if(location.hash) location.hash = ""; else home(); });
window.addEventListener("hashchange", ruta);
ruta();
cargarVotos().then(() => {
  const l = LIBROS.find(x => x.id === location.hash.slice(1));
  if(l) pintarRate(l); else if(!q.value && location.hash !== "#sala") home();
});
</script>
</body>
</html>
